## Carbon syntax theme for justpager.
## Keys are tree-sitter capture names; justpager strips trailing segments to find a key.
## Roles and attributes follow modules/nvim/src/lua/editor/highlights.lua.

[normal]
fg = "${color_hash('editor_text')}"

[syntax]
comment                 = { fg = "${color_hash('syn_comment')}", italic = true }

keyword                 = { fg = "${color_hash('syn_keyword')}", bold = true }
operator                = { fg = "${color_hash('syn_keyword')}", bold = true }
label                   = { fg = "${color_hash('syn_keyword')}", bold = true }

function                = { fg = "${color_hash('syn_function')}", bold = true }
constructor             = { fg = "${color_hash('syn_function')}", bold = true }
"function.builtin"      = { fg = "${color_hash('syn_special')}", bold = true }
"function.macro"        = { fg = "${color_hash('syn_special')}", bold = true }
"function.special"      = { fg = "${color_hash('syn_special')}", bold = true }

type                    = { fg = "${color_hash('syn_type')}" }
module                  = { fg = "${color_hash('syn_type')}" }
"type.builtin"          = { fg = "${color_hash('syn_special')}", bold = true }

variable                = { fg = "${color_hash('syn_identifier')}" }
property                = { fg = "${color_hash('syn_identifier')}" }

constant                = { fg = "${color_hash('syn_constant')}" }
character               = { fg = "${color_hash('syn_constant')}" }
number                  = { fg = "${color_hash('syn_number')}" }
boolean                 = { fg = "${color_hash('syn_boolean')}" }

string                  = { fg = "${color_hash('syn_string')}" }
escape                  = { fg = "${color_hash('syn_special')}", bold = true }
"string.special"        = { fg = "${color_hash('syn_special')}", bold = true }
"string.special.key"    = { fg = "${color_hash('syn_identifier')}" }
embedded                = {}

punctuation             = { fg = "${color_hash('syn_delimiter')}" }
delimiter               = { fg = "${color_hash('syn_delimiter')}" }
"punctuation.special"   = { fg = "${color_hash('syn_special')}", bold = true }

attribute               = { fg = "${color_hash('syn_special')}", bold = true }
tag                     = { fg = "${color_hash('syn_special')}", bold = true }
