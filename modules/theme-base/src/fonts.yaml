#-------------------------------------------------------------------------------
# Fonts
#-------------------------------------------------------------------------------


fonts:
#-------------------------------------------------------------------------------

  # Faces
  font_mono:         "Nordwand Mono"
  font_sans:         "Nimbus Sans"
  font_serif:        "Noto Serif"

  # Sizes
  font_size_tiny:    10
  font_size_xsmall:  11
  font_size_small:   12
  font_size_msmall:  13
  font_size_medium:  14
  font_size_mlarge:  15
  font_size_large:   16
  font_size_xlarge:  18
  font_size_xxlarge: 20

  # Roles: one surface each, tuned per host in hosts/<host>.yaml.
  font_size_terminal:    11
  font_size_bar:         14
  font_size_bar_tooltip: 13

  # Content zoom: qutebrowser pages, draw.io
  zoom_level:        1.00
