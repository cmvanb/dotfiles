# Workspace-to-output assignments (auto-generated)
<%
    order_file = XDG_CONFIG_HOME + '/sway/outputs/output-order'
    # Numbered 101+ (invisible ordering only) so they never collide with the
    # per-output numeric ranges (1-10 primary, 11-20 secondary, 21-30 tertiary, ...).
    named_workspaces = ['101:home', '102:mail', '103:todo', '104:vim', '105:auth', '106:system', '107:config', '108:dev', '109:project', '110:ssh', '111:chat', '112:audio']
    # Named workspaces land on the primary output (slot 0) unless overridden per host.
    slot_overrides = {'cyxwel': {'112:audio': 1, '111:chat': 1}}.get(DEPLOY_HOST, {})
    with open(order_file) as _f:
        outputs = [
            l.strip()
            for l in _f
            if l.strip() and not l.strip().startswith('#')
        ]
%>
% for slot, output in enumerate(outputs):
<%  offset = slot * 10 %>
    % for i in range(1, 11):
workspace ${offset + i} output ${output}
    % endfor
    % for ws in named_workspaces:
        % if min(slot_overrides.get(ws, 0), len(outputs) - 1) == slot:
workspace ${ws} output ${output}
        % endif
    % endfor
% endfor
