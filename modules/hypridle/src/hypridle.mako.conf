#-------------------------------------------------------------------------------
# Hypridle configuration
#-------------------------------------------------------------------------------
<%
    idle_actions = {
        'casino': 'systemctl hibernate',
        'cyxwel': 'systemctl suspend',
    }
    idle_action = idle_actions.get(DEPLOY_HOST)
%>
% if idle_action:
listener {
    timeout = 1800
    on-timeout = ${idle_action}
}
% endif
