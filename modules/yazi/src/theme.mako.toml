    # Documents
    { name = "txt", text = "󰦪" },
    { name = "pdf", text = "" },
    { name = "md", text = "" },
    { name = "html", text = "" },

    # Images
    { name = "heic", text = "" },
    { name = "jpg", text = "" },
    { name = "jpeg", text = "" },
    { name = "png", text = "" },
    { name = "webp", text = "" },

    # Video
    { name = "mkv", text = "" },
    { name = "mp4", text = "" },
    { name = "webm", text = "" },

