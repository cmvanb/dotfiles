#-------------------------------------------------------------------------------
# Yazi theme
#-------------------------------------------------------------------------------

[filetype]
## File type coloring to match ls/eza/dircolors
rules = [
    ## Directories
    { url = "*/", is = "sticky", fg = "${color_hash('ansi_magenta')}" },
    { url = "*/", fg = "${color_hash('ansi_blue')}" },

    ## Special file types
    { url = "*", is = "exec",   fg = "${color_hash('ansi_green')}", bold = true },
    { url = "*", is = "link",   fg = "${color_hash('ansi_brcyan')}", bold = true },
    { url = "*", is = "orphan", fg = "${color_hash('ansi_red')}" },
    { url = "*", is = "fifo",   fg = "${color_hash('ansi_bryellow')}" },
    { url = "*", is = "sock",   fg = "${color_hash('ansi_bryellow')}" },
    { url = "*", is = "block",  fg = "${color_hash('ansi_brmagenta')}" },
    { url = "*", is = "char",   fg = "${color_hash('ansi_magenta')}" },

    ## Regular files
    { url = "*", fg = "${color_hash('ansi_brblue')}" },
]

[mgr]
syntect_theme = "~/.config/bat/themes/carbon.tmTheme"
border_style = { fg = "#1d2d3d" }

[icon]
files = [
    # Dev
    { name = ".editorconfig", text = "" },
    { name = ".gitattributes", text = "" },
    { name = ".gitignore", text = "" },
    { name = ".gitmodules", text = "" },
    { name = "Makefile", text = "" },
    { name = "LICENSE", text = "" },
    { name = "Cargo.lock", text = "" },
    { name = "Dockerfile", text = "" },

    # Configuration
    { name = "config", text = "" }
]
dirs = [
    # Configuration
    { name = ".config", text = "" },
    { name = ".local", text = "" },
    { name = ".ssh", text = "" },

    # Home
    { name = "Documents", text = "" },
    { name = "Downloads", text = "" },

    # Dev
    { name = ".git", text = "" },
    { name = ".github", text = "" },
]
exts = [
    # Code
    { name = "rs", text = "" },
    { name = "py", text = "" },
    { name = "js", text = "" },
    { name = "ts", text = "" },
    { name = "jsx", text = "" },
    { name = "tsx", text = "" },
    { name = "c", text = "" },
    { name = "cpp", text = "" },
    { name = "h", text = "" },
    { name = "hpp", text = "" },
    { name = "lua", text = "" },
    { name = "css", text = "" },

    # Shell
    { name = "sh", text = "" },
    { name = "bash", text = "" },
    { name = "zsh", text = "" },
    { name = "fish", text = "" },

    # Configuration
    { name = "conf", text = "" },
    { name = "cfg", text = "" },
    { name = "ini", text = "" },

    # Data
    { name = "json", text = "" },
