# Workspace session for the dotfiles.

[[entry]]
type = "browser"
workspace = "config"
session = "dotfiles"
wait_for_network = true

[[entry]]
type = "terminal"
workspace = "config"
cwd = "~/Code/dotfiles"

[[entry]]
type = "terminal"
workspace = "config"
cwd = "~/Code/dotfiles"
command = "opencode"
focused = true

[[entry]]
type = "terminal"
workspace = "config"
cwd = "~/Code/dotfiles"
command = "edit"
