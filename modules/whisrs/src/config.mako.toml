#-------------------------------------------------------------------------------
# whisrs dictation daemon
#
# Offline transcription with whisper.cpp, injected at the cursor over uinput.
# Recording is driven by compositor keybinds (see the sway keymaps), so no
# built-in [hotkeys] are declared here.
#
# large-v3 runs on the GPU through the whisrs-vulkan package. Measured on the
# 7900 XTX it decodes 24x faster than real time, and it cuts the word error
# rate of the small.en model by 71% on accented speech.
# casino has no discrete GPU and runs the CPU package with small.en.
#-------------------------------------------------------------------------------

<%
    whisrs_model = 'ggml-small.en.bin' if DEPLOY_HOST == 'casino' else 'ggml-large-v3.bin'
    # "default" follows a connected Bluetooth headset, whose mic forces the
    # A2DP to HSP/HFP profile switch and degrades playback while recording.
    whisrs_device = 'alsa_input.pci-0000_65_00.6.analog-stereo' if DEPLOY_HOST == 'casino' else 'default'
%>

[general]
backend = "local-whisper"
language = "en"
notify = true
remove_filler_words = true
audio_feedback = true
audio_feedback_volume = 0.2
tray = false
overlay = true

# Visual feedback
#-------------------------------------------------------------------------------

[overlay]
theme = "custom"
width = 110
height = 44

[overlay.colors]
background = "#${system_bg}EB"
ring = "#${gray_5}80"
recording = "#${red_5}"
transcribing = "#${cyan_5}"
speaking = "#${green_5}"
glow = "#${red_4}"

# Audio capture
#-------------------------------------------------------------------------------

[audio]
device = "${whisrs_device}"

# Text injection
#-------------------------------------------------------------------------------

[input]
key_delay_ms = 2
clipboard_fallback = true

# Transcription
#-------------------------------------------------------------------------------

[local-whisper]
model_path = "${XDG_DATA_HOME}/whisrs/models/${whisrs_model}"
segmentation = "silence"
phrase_silence_ms = 400

# Recording hooks
#-------------------------------------------------------------------------------

[hooks]
media_auto_pause = true
